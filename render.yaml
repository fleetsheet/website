projects:
  - name: Fleet Website
    environments:
      - name: production
        services:
          - type: web
            runtime: static
            name: fleet-website
            repo: https://github.com/fleetsheet/website
            branch: main
            autoDeployTrigger: checksPass
            buildCommand: pnpm install --frozen-lockfile && if [ "$IS_PULL_REQUEST" = "true" ]; then export SITE_ENV=preview; fi && pnpm --filter web build
            staticPublishPath: ./web/dist
            buildFilter:
              paths:
                - web/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
                - render.yaml
            previews:
              generation: automatic
            envVars:
              - key: NODE_VERSION
                value: '22'
              - key: WEBSITE_URL
                value: https://runfleet.com
              - key: SITE_ENV
                value: production
            headers:
              - path: /*
                name: X-Frame-Options
                value: SAMEORIGIN
              - path: /*
                name: Content-Security-Policy
                value: frame-ancestors 'self'
              - path: /*
                name: X-Content-Type-Options
                value: nosniff
              - path: /*
                name: Referrer-Policy
                value: strict-origin-when-cross-origin
              - path: /*
                name: Permissions-Policy
                value: geolocation=(), microphone=(), camera=(), payment=()
              - path: /_astro/*
                name: Cache-Control
                value: public, max-age=31536000, immutable
            routes:
              - type: rewrite
                source: /js/script.js
                destination: https://plausible.io/js/plausible.js
              - type: rewrite
                source: /api/event
                destination: https://plausible.io/api/event
