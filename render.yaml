projects:
  - name: Fleet Website
    environments:
      - name: production
        services:
          - type: web
            runtime: static
            name: fleet-website
            repo: https://github.com/fleetsheet/website
            branch: main
            autoDeployTrigger: checksPass
            buildCommand: pnpm install --frozen-lockfile && if [ "$IS_PULL_REQUEST" = "true" ]; then export SITE_ENV=preview; fi && pnpm --filter web build
            staticPublishPath: ./web/dist
            buildFilter:
              paths:
                - web/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
                - render.yaml
            previews:
              generation: automatic
            envVars:
              - key: NODE_VERSION
                value: '22'
              - key: WEBSITE_URL
                value: https://www.runfleet.com
              - key: SITE_ENV
                value: production
            routes:
              - type: redirect
                source: /home
                destination: /
              - type: redirect
                source: /contact-1
                destination: /contact
              - type: redirect
                source: /features-overview
                destination: /platform
              - type: redirect
                source: /solutions-overview
                destination: /
              - type: redirect
                source: /features
                destination: /platform
              - type: redirect
                source: /solutions
                destination: /
              - type: redirect
                source: /custom-workflows
                destination: /platform/workflow-builder
              - type: redirect
                source: /ai-agents
                destination: /platform/runner-ai
              - type: redirect
                source: /document-management
                destination: /features/document-management
              - type: redirect
                source: /asset-management
                destination: /features/asset-management
              - type: redirect
